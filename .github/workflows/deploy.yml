name: Dua web len GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # mỗi ngày 1 lần, để phần gây quỹ tự cập nhật theo ngày
  workflow_dispatch:       # cho phép bấm chạy tay trên GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clb-vo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python xuat_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: clb-vo/_site
      - id: deployment
        uses: actions/deploy-pages@v4
